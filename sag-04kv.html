<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВЛ-0,4 кВ — Стрела провеса (алюминиевые провода)</title>
<style>
 body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f5;margin:0;padding:16px;color:#1c2733;}
 .card{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.09);}
 h1{font-size:20px;color:#1F4E79;margin:0 0 4px;}
 .norm{color:#5a6b7b;font-size:13.5px;margin-bottom:16px;line-height:1.45;}
 label{display:block;font-size:14px;font-weight:600;margin:14px 0 4px;color:#2b3a4a;}
 select,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfd8e3;border-radius:8px;font-size:15px;background:#fff;}
 button{width:100%;margin-top:18px;padding:13px;background:#1F4E79;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;}
 button:hover{background:#173a5c;}
 .sec{border-top:1px solid #e3e9f0;padding-top:14px;margin-top:14px;}
 .sec h3{color:#1F4E79;font-size:15px;margin:0 0 6px;}
 .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px;}
 .row span:last-child{font-weight:700;white-space:nowrap;}
 .panel{background:#eef4fb;border:1px solid #d7e3f2;border-radius:8px;padding:10px 14px;margin:10px 0;}
 .init{background:#eef8f0;border:1px solid #cfe6d4;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:14px;line-height:1.5;}
 .ok{color:#2e7d32;font-weight:700;}
 .bad{color:#c62828;font-weight:700;}
 .err{background:#fdecea;border:1px solid #f2b8b5;color:#b3261e;border-radius:8px;padding:12px 14px;margin-top:14px;font-size:14px;}
 .note{background:#fff8dc;border:1px solid #e6d78a;border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:14px;}
 .warn{color:#a05a00;font-size:13px;margin-top:8px;}
 .src{color:#78909c;font-size:12.5px;font-style:italic;margin-top:10px;}
 .small{font-size:13px;color:#5a6b7b;}
 .hidden{display:none;}
</style>
</head>
<body>
<div class="card">
 <h1>ВЛ-0,4 кВ: стрела провеса</h1>
 <div class="norm">Алюминиевые провода А-16…А-120 · III район по гололёду (стенка 15 мм) · норма габарита до земли: <b>6 м</b><br>
 Запас прочности: <b>2,86</b> (А-16…А-95, 35 % σр) и <b>2,50</b> (А-120, 40 % σр) — по табл. 2.4.3 ПУЭ</div>

 <label>Марка провода</label>
 <select id="mark">
  <option>А-16</option><option>А-25</option><option selected>А-35</option>
  <option>А-50</option><option>А-70</option><option>А-95</option><option>А-120</option>
 </select>

 <label>Длина пролёта, м (20–60 м; допустим ввод 1–60, ниже 20 м — ориентировочно)</label>
 <input id="span" list="spans" type="number" step="0.5" min="1" max="60" value="30">
 <datalist id="spans"><option>20</option><option>25</option><option>30</option><option>35</option><option>40</option><option>45</option><option>50</option><option>55</option><option>60</option></datalist>

 <label>Температура монтажа, °C (шаг 10 °C или своё значение)</label>
 <select id="tsel" onchange="tcustom()">
  <option value="-40">−40</option><option value="-30">−30</option><option value="-20">−20</option>
  <option value="-10">−10</option><option value="0">0</option><option value="10">+10</option>
  <option value="20" selected>+20</option><option value="30">+30</option><option value="40">+40</option>
  <option value="custom">своё значение…</option>
 </select>
 <div id="tcustombox" class="hidden">
  <label style="margin-top:6px">Своё значение температуры (−40…+40 °C)</label>
  <input id="tval" type="number" step="1" min="-40" max="40" value="15">
 </div>

 <label>Высота подвеса провода над землёй, м (по умолчанию 7,0 — опора СВ-95, худший случай)</label>
 <input id="h" type="number" step="0.1" min="4" max="15" value="7.0">

 <button onclick="calc()">Рассчитать</button>
 <div id="out"></div>
</div>

<script>
const E=6300.0, ALPHA=23e-6;
const W={
 "А-16": {F:15.9, d:5.1, w:0.044, Pr:308, sr:19.37, sdop:6.78, g1:2.767e-3, g3:56.38e-3, Lkr:16.7},
 "А-25": {F:24.6, d:6.3, w:0.068, Pr:459, sr:18.65, sdop:6.53, g1:2.764e-3, g3:39.49e-3, Lkr:23.0},
 "А-35": {F:34.4, d:7.5, w:0.095, Pr:603, sr:17.52, sdop:6.13, g1:2.762e-3, g3:30.50e-3, Lkr:28.0},
 "А-50": {F:48.3, d:9.0, w:0.137, Pr:836, sr:17.30, sdop:6.06, g1:2.836e-3, g3:23.91e-3, Lkr:35.5},
 "А-70": {F:68.0, d:10.7, w:0.189, Pr:1151, sr:16.92, sdop:5.92, g1:2.779e-3, g3:18.81e-3, Lkr:44.2},
 "А-95": {F:93.5, d:12.4, w:0.253, Pr:1507, sr:16.12, sdop:5.64, g1:2.706e-3, g3:15.13e-3, Lkr:52.6},
 "А-120":{F:117.0,d:14.0,w:0.322, Pr:2028, sr:17.33, sdop:6.93, g1:2.752e-3, g3:13.26e-3, Lkr:74.2}
};
function solve(L,gamma,t,si,gi,ti,F){
 const A=gamma*gamma*L*L*E/24.0;
 const C=si-gi*gi*L*L*E/(24.0*si*si);
 const B=C-ALPHA*E*(t-ti);
 const g=s=>s-A/(s*s)-B;
 let lo=0.02, hi=15.0;
 for(let i=0;i<200;i++){const m=(lo+hi)/2; if(g(lo)*g(m)<=0) hi=m; else lo=m;}
 const s=(lo+hi)/2;
 return {s:s, f:gamma*L*L/(8*s), T:s*F};
}
function tcustom(){document.getElementById('tcustombox').classList.toggle('hidden',document.getElementById('tsel').value!=='custom');}
function row(a,b){return '<div class="row"><span>'+a+'</span><span>'+b+'</span></div>';}
function status(gab){return gab>=6.0?'<span class="ok">Соответствует</span>':'<span class="bad">Не соответствует</span>';}
function calc(){
 const out=document.getElementById('out');
 const mark=document.getElementById('mark').value, p=W[mark];
 const L=parseFloat(String(document.getElementById('span').value).replace(',','.'));
 const h=parseFloat(String(document.getElementById('h').value).replace(',','.'));
 let t;
 if(document.getElementById('tsel').value==='custom'){t=parseFloat(String(document.getElementById('tval').value).replace(',','.'));}
 else t=parseFloat(document.getElementById('tsel').value);
 if(isNaN(L)||L<=0||L>60){out.innerHTML='<div class="err">Введите длину пролёта от 1 до 60 м.</div>';return;}
 if(isNaN(t)||t<-40||t>40){out.innerHTML='<div class="err">Введите температуру от −40 до +40 °C.</div>';return;}
 if(isNaN(h)||h<4||h>15){out.innerHTML='<div class="err">Введите высоту подвеса от 4 до 15 м.</div>';return;}
 const sd=p.sdop, n=(mark==='А-120')?2.50:2.86;
 let si,gi,ti;
 if(L>p.Lkr){si=sd;gi=p.g3;ti=-5.0;}
 else{si=sd;gi=p.g1;ti=-40.0;}
 const m = solve(L,p.g1,t,si,gi,ti,p.F);
 const j = solve(L,p.g1,40.0,si,gi,ti,p.F);
 const z = solve(L,p.g1,-40.0,si,gi,ti,p.F);
 const g5= solve(L,p.g3,-5.0,si,gi,ti,p.F);
 const gp= solve(L,p.g3, 5.0,si,gi,ti,p.F);
 const fmax=Math.max(j.f,g5.f);
 const gab=h-fmax;
 const need=(6.0+fmax);
 let warn=(L<20)?'<div class="warn">Пролёт вне табличной области (20–60 м) — значение ориентировочное.</div>':'';
 let html='';
 html+='<div class="init"><b>Исходный режим:</b> для пролёта '+L+' м правит '+(L>p.Lkr?'гололёд (−5 °C)':'низшая температура (−40 °C)')+'; Lкр = '+p.Lkr.toFixed(1)+' м. Исходное напряжение σдоп = '+sd.toFixed(2)+' кг/мм² (запас '+n.toFixed(2)+').'+warn+'</div>';
 html+='<div class="sec"><h3>Режим монтажа (t = '+t+' °C)</h3>';
 html+=row('Тяжение:',m.T.toFixed(1)+' кгс <span class="small">(σ = '+m.s.toFixed(2)+' кг/мм²)</span>');
 html+=row('Стрела провеса:',m.f.toFixed(2)+' м');
 html+='<div class="src">Источник: расчёт по уравнению состояния провода (методика базового файла v7; ПУЭ табл. 2.4.3)</div></div>';
 html+='<div class="sec"><h3>Режим «Жара» (+40 °C)</h3>';
 html+=row('Стрела провеса:',j.f.toFixed(2)+' м');
 html+=row('Габарит до земли (при +40 °C):',(h-j.f).toFixed(2)+' м')+'</div>';
 html+='<div class="sec"><h3>Режим «Мороз» (−40 °C), без гололёда</h3>';
 html+=row('Тяжение:',z.T.toFixed(1)+' кгс <span class="small">(σ = '+z.s.toFixed(2)+' кг/мм²)</span>');
 html+=row('Стрела провеса:',z.f.toFixed(2)+' м')+'</div>';
 html+='<div class="sec"><h3>Режим гололёда (стенка 15 мм)</h3>';
 html+='<div class="panel"><b>t = −5 °C (гололёд)</b>'
  +row('Тяжение:',g5.T.toFixed(1)+' кгс <span class="small">(σ = '+g5.s.toFixed(2)+' кг/мм²)</span>')
  +row('Стрела провеса:',g5.f.toFixed(2)+' м')
  +row('Габарит до земли:',(h-g5.f).toFixed(2)+' м')
  +row('Норма (6 м):',status(h-g5.f))+'</div>';
 html+='<div class="panel"><b>t = +5 °C (гололёд)</b>'
  +row('Тяжение:',gp.T.toFixed(1)+' кгс <span class="small">(σ = '+gp.s.toFixed(2)+' кг/мм²)</span>')
  +row('Стрела провеса:',gp.f.toFixed(2)+' м')
  +row('Габарит до земли:',(h-gp.f).toFixed(2)+' м')
  +row('Норма (6 м):',status(h-gp.f))+'</div></div>';
 html+='<div class="sec"><h3>Контроль габарита (наибольшая стрела)</h3>';
 html+=row('f наибольшая = max(f +40; f гололёд):',fmax.toFixed(2)+' м');
 html+=row('Габарит до земли:',gab.toFixed(2)+' м');
 html+=row('Норма (6 м):',status(gab));
 if(gab<6.0) html+='<div class="warn">Рекомендация: опора СВ-110, подвес ≥ '+need.toFixed(1)+' м (или сократить пролёт).</div>';
 html+='</div>';
 html+='<div class="note"><b>Ветер.</b> В расчёт ветер не входит: монтаж проводов при сильном ветре не производится — работы на высоте при ветре более 10 м/с запрещены. Проверка эксплуатационного режима «гололёд + ветер» (Рн = 50 кг/м², при гололёде 25 % напора) показала: дополнительное отягощение +9…+16 % полностью поглощается заложенным запасом прочности — фактический запас остаётся <b>не ниже 2,48</b> (А-16…А-95 при нормативе 2,86) и <b>не ниже 2,69</b> (А-120 при нормативе 2,50). Обрыв провода ветровыми режимами не прогнозируется. Габарит при ветре не меняется (нагрузка горизонтальная), провод уносится вбок — при пересечениях и сближениях проверять отдельно.</div>';
 html+='<div class="src">Методика: уравнение состояния провода; E = 6,3·10³ кг/мм²; α = 23·10⁻⁶ 1/°C; гололёд b = 15 мм, ρ = 0,9 г/см³. База — «Расчёт_ВЛ_базовый_файл_v7.xlsx».</div>';
 out.innerHTML=html;
}
tcustom();
</script>
</body>
</html>
